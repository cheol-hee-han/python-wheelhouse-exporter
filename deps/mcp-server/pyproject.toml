[project]
name = "deps-mcp-server"
version = "1.0.0"
description = "A comprehensive MCP server with multi-tool integrations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
 
    # =========================================================
    # [1] MCP 핵심 프레임워크
    # =========================================================
    # Anthropic 공식 MCP Python SDK (FastMCP 포함)
    # tools / resources / prompts 구현, stdio·SSE·Streamable HTTP 트랜스포트
    "mcp>=1.26.0",
 
    # =========================================================
    # [2] LLM SDK
    # =========================================================
    "anthropic>=0.85.0",
    "openai>=1.70.0",
 
    # =========================================================
    # [3] 데이터 검증 & 설정 관리
    # =========================================================
    "pydantic>=2.12.5",
    "pydantic-settings>=2.8.1",
    "pydantic-extra-types>=2.10.3",
 
    # =========================================================
    # [4] 웹 서버 / 비동기 런타임
    # =========================================================
    "uvicorn[standard]>=0.34.0",
    "fastapi[standard]>=0.115.12",
    "starlette>=0.46.0",
    # SSE 스트리밍 응답 (MCP SSE 트랜스포트 서버 측)
    "sse-starlette>=2.2.1",
    # WebSocket 서버 지원 (MCP WS 트랜스포트, 실시간 양방향 통신)
    "websockets>=14.2",
 
    # =========================================================
    # [5] HTTP 클라이언트
    # =========================================================
    "httpx[http2]>=0.28.1",
    # httpx로 SSE 스트림 소비
    "httpx-sse>=0.4.0",
    # 고성능 비동기 HTTP (대용량 동시 요청, 파일 업로드/다운로드)
    "aiohttp>=3.11.14",
 
    # =========================================================
    # [6] 비동기 유틸리티
    # =========================================================
    "aiofiles>=24.1.0",
    "anyio>=4.9.0",
 
    # =========================================================
    # [7] 데이터베이스 & ORM
    # =========================================================
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.1",
    # MongoDB 비동기 드라이버 (비정형 문서 스토어)
    "motor>=3.7.0",
    # MongoDB ODM — Pydantic 모델과 직접 연동
    "beanie>=1.29.0",
 
    # =========================================================
    # [8] 캐시 & 메시지 큐
    # =========================================================
    "redis[hiredis]>=5.2.1",
    # NATS 비동기 클라이언트 (경량 pub/sub, JetStream)
    "nats-py>=2.10.0",
    # Kafka 비동기 클라이언트 (대용량 이벤트 스트리밍)
    "aiokafka>=0.12.0",
 
    # =========================================================
    # [9] 데이터 직렬화 & 포맷 처리
    # =========================================================
    "orjson>=3.10.16",
    "pyyaml>=6.0.2",
    "tomli>=2.2.1",
    "tomli-w>=1.1.0",
    "msgpack>=1.1.0",
    # Protocol Buffers (gRPC 연동, 고성능 바이너리 직렬화)
    "protobuf>=5.29.4",
    # Apache Arrow / Parquet (대용량 컬럼형 데이터, AI 파이프라인)
    "pyarrow>=19.0.1",
    # CSV / tabular 데이터 처리
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
 
    # =========================================================
    # [10] 텍스트 & 문서 처리
    # =========================================================
    "beautifulsoup4>=4.13.3",
    "lxml>=5.3.1",
    "markdown>=3.7",
    "pypdf>=5.4.0",
    "python-docx>=1.1.2",
    "jinja2>=3.1.6",
    # 마크다운 확장 파싱 (CommonMark 스펙 준수)
    "mistune>=3.1.3",
    # HTML → 마크다운 역변환 (웹 콘텐츠 → LLM 입력 최적화)
    "markdownify>=0.14.1",
    # 코드 구문 강조 (응답 렌더링, diff 표시)
    "pygments>=2.19.1",
 
    # =========================================================
    # [11] 웹 스크래핑 & 콘텐츠 추출
    # =========================================================
    # 웹 페이지 본문 추출 (boilerplate 제거, LLM 컨텍스트 정제)
    "trafilatura>=2.0.0",
    # URL 파싱 & 정규화
    "yarl>=1.18.3",
    # robots.txt 파싱 (크롤러 정책 준수, pure Python)
    "protego>=0.3.1",
 
    # =========================================================
    # [12] 클라우드 스토리지 & 파일 시스템
    # =========================================================
    # AWS S3 / DynamoDB / SQS 비동기 클라이언트 (MCP 파일 리소스 백엔드)
    "aiobotocore>=2.21.1",
    # Google Cloud Storage / BigQuery 클라이언트
    "google-cloud-storage>=3.1.0",
    # 파일 타입 감지 (MIME, magic bytes) → Content-Type 자동 설정
    "python-magic>=0.4.27",
    # 파일 경로 패턴 매칭 (glob, .gitignore 스타일)
    "pathspec>=0.12.1",
    # 아카이브 처리 (ZIP, TAR, GZ 압축/해제)
    "py7zr>=0.22.0",
 
    # =========================================================
    # [13] 코드 실행 & 정적 분석
    # =========================================================
    # Python 코드 AST 파싱 (코드 실행 전 안전성 검사)
    "astroid>=3.3.9",
    # 코드 포맷터 (LLM 생성 코드 정규화)
    "black>=25.1.0",
 
    # =========================================================
    # [14] SaaS 통합 클라이언트
    # =========================================================
    # GitHub REST & GraphQL API (이슈, PR, 파일, 검색)
    "PyGithub>=2.6.1",
    # Slack Web API & Bolt 프레임워크 (메시지, 파일, 채널)
    "slack-sdk>=3.34.0",
    # Jira / Confluence REST API 클라이언트
    "jira>=3.8.0",
    # Google Workspace (Docs, Sheets, Drive, Gmail, Calendar)
    "google-api-python-client>=2.166.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    # Notion API 클라이언트
    "notion-client>=2.3.0",
 
    # =========================================================
    # [15] 벡터 DB & 임베딩
    # =========================================================
    # Qdrant 벡터 DB 비동기 클라이언트
    "qdrant-client>=1.13.3",
    # 범용 LLM/임베딩 통합 (100+ 모델 프로바이더 단일 인터페이스)
    "litellm>=1.63.11",
    # 벡터 연산 (코사인 유사도, 행렬 연산)
    "numpy>=2.2.4",
 
    # =========================================================
    # [16] 환경 설정 & 비밀 관리
    # =========================================================
    "python-dotenv>=1.1.0",
    "keyring>=25.6.0",
 
    # =========================================================
    # [17] 재시도 & 회복탄력성
    # =========================================================
    "tenacity>=9.1.0",
    # 서킷 브레이커 패턴 (외부 서비스 장애 전파 차단)
    "pybreaker>=1.2.0",
    # rate limit 토큰 버킷 (429 응답 자동 백오프)
    "limits>=3.14.2",
 
    # =========================================================
    # [18] 로깅 & 관측성
    # =========================================================
    "structlog>=25.4.0",
    "rich>=13.9.4",
    "opentelemetry-api>=1.31.1",
    "opentelemetry-sdk>=1.31.1",
    "opentelemetry-instrumentation-httpx>=0.52b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.52b0",
    # Prometheus 메트릭 수집 (tool 호출 횟수, 레이턴시 히스토그램)
    "prometheus-client>=0.21.1",
 
    # =========================================================
    # [19] CLI & 스케줄링
    # =========================================================
    "typer>=0.15.2",
    "apscheduler>=3.11.0",
 
    # =========================================================
    # [20] 보안
    # =========================================================
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "authlib>=1.4.1",
 
    # =========================================================
    # [21] 멀티미디어 처리
    # =========================================================
    "pillow>=11.1.0",
    # 오디오 메타데이터 / 기본 처리 (TTS 전처리)
    "mutagen>=1.47.0",
    # multipart/form-data 처리 (파일 업로드 수신)
    "python-multipart>=0.0.20",
]
 
# =========================================================
# Optional dependency groups (uv: install with --extra <n>)
# =========================================================
[project.optional-dependencies]
 
# 개발 & 테스트 도구
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.1.0",
    "mypy>=1.15.0",
    "ruff>=0.9.10",
    "pre-commit>=4.1.0",
    "ipython>=8.34.0",
    # MCP 서버 로컬 디버깅 인스펙터 (mcp dev 커맨드)
    "mcp[cli]>=1.26.0",
]
 
# MySQL / MariaDB 지원
mysql = [
    "aiomysql>=0.2.0",
]
 
# Playwright 기반 JS 렌더링 브라우저 자동화 (SPA 스크래핑)
browser = [
    "playwright>=1.50.0",
]
 
# 벡터 DB / 로컬 임베딩 내재화 (RAG 파이프라인)
vector = [
    "chromadb>=0.6.3",
    "sentence-transformers>=3.4.1",
    "faiss-cpu>=1.10.0",
]
 
# gRPC 서버/클라이언트 (고성능 내부 서비스 간 통신)
grpc = [
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
]
 
# RabbitMQ AMQP 클라이언트
rabbitmq = [
    "aio-pika>=9.5.5",
]
 
# Azure 클라우드 스토리지 & 서비스
azure = [
    "azure-storage-blob>=12.25.1",
    "azure-identity>=1.21.0",
]
 
# =========================================================
[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.1.0",
    "mypy>=1.15.0",
    "ruff>=0.9.10",
    "mcp[cli]>=1.26.0",
]

[tool.uv]
package = false
 
[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
 
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
 
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
 
[tool.hatch.build.targets.wheel]
packages = ["src"]
[project]
name = "agent-runtime"
version = "0.1.0"
description = "Offline-ready LangGraph multi-agent runtime for data specification extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core agent/runtime
    "langgraph>=1.1,<1.2",
    "langchain-core>=1.2,<1.3",
    "pydantic>=2.11,<2.12",
    "typing-extensions>=4.12,<5",

    # API / app
    "fastapi>=0.135,<0.136",
    "uvicorn[standard]>=0.41,<0.42",
    "httpx>=0.28,<0.29",
    "requests>=2.32,<2.33",
    "pydantic-settings>=2.13,<2.14",
    "tenacity>=9.0,<10",
    "orjson>=3.10,<4",
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",

    # Search / storage
    "elasticsearch>=8.18,<9",
    "qdrant-client>=1.17,<1.18",
    "pymongo>=4.16,<5",
    "psycopg2-binary>=2.9.11,<3",
    "oracledb>=3.4,<4",
    "SQLAlchemy>=2.0.48,<2.1",

    # Data / validation
    "pandas>=3.0,<3.1",
    "numpy>=2.4,<2.5",
    "pyarrow>=23.0,<24",

    # Misc
    "packaging>=24.1,<25",
    "rich>=13.8,<14",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<0.5",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-mock>=3.14,<4",
    "mypy>=1.19,<2",
    "ruff>=0.15,<0.16",
    "types-requests>=2.32.4.20260107,<2.33",
]

#cloudera = [
#  "impyla>=0.22,<0.23",
#  "thrift==0.16.0",
#  "thrift-sasl==0.4.3",
#  "sasl>=0.3.1,<0.4"
#]

[build-system]
requires = ["setuptools>=75,<76", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
